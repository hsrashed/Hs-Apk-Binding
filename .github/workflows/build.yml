name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup & Build APK
      run: |
        # প্রজেক্টের আসল ফোল্ডার খুঁজে বের করা
        BUILD_FILE=$(find . -name "settings.gradle*" -o -name "build.gradle*" | head -n 1)
        if [ -n "$BUILD_FILE" ]; then
          TARGET_DIR=$(dirname "$BUILD_FILE")
          echo "Entering directory: $TARGET_DIR"
          cd "$TARGET_DIR"
        fi

        # gradlew না থাকলে স্বয়ংক্রিয়ভাবে তৈরি করা
        if [ ! -f "gradlew" ]; then
          echo "gradlew not found. Generating wrapper..."
          gradle wrapper
        fi

        # পারমিশন দিয়ে বিল্ড রান করা
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Hs-Apk-Debug
        path: '**/build/outputs/apk/debug/*.apk'
