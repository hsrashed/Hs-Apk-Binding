name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # এর মাধ্যমে আপনি নিজে Actions ট্যাব থেকে ম্যানুয়ালি বিল্ড চালু করতে পারবেন

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: |
        if [ -d "HsApkBinder" ]; then
          cd HsApkBinder
        fi
        chmod +x gradlew

    - name: Build with Gradle
      run: |
        if [ -d "HsApkBinder" ]; then
          cd HsApkBinder
        fi
        ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Hs-Apk-Debug
        path: '**/build/outputs/apk/debug/*.apk'
